name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm --prefix backend ci --ignore-scripts

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts

      # ── Gates ───────────────────────────────────────────────────────────
      # Reihenfolge nach Laufzeit: was schnell rot wird, laeuft zuerst.
      # Alle Schritte blockieren. Bis 2026-07-31 lief nur der Build, und die
      # Tests standen auf continue-on-error, d. h. ein roter Test hat nichts
      # aufgehalten. Push auf main deployt automatisch, also gab es faktisch
      # kein Netz. Siehe STRUKTUR_PLAN.md, Stufe 0.

      - name: Unit-Tests
        run: npm test

      - name: Lint (nur Bug-Regeln, Warnungen blockieren nicht)
        run: npm run lint

      - name: Typecheck (backend + frontend)
        run: npm run typecheck

      - name: Build backend
        run: npm --prefix backend run build

      - name: Build frontend
        run: npm --prefix frontend run build
